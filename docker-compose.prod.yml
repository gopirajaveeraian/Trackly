version: '3.8'

services:
  postgres:
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trackly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-trackly}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trackly}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trackly}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL is required}
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
